# Runs the stack against a stand-in Jira MCP server, so it works with no
# credentials at all:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
services:
  fake-jira-mcp:
    build:
      context: ./backend
    container_name: connector-fake-jira-mcp
    command: ["python", "-m", "dev.fake_jira_mcp"]
    expose:
      - "9100"
    networks:
      - connector-net

  backend:
    environment:
      JIRA_MCP_URL: http://fake-jira-mcp:9100/mcp
    depends_on:
      fake-jira-mcp:
        condition: service_started
